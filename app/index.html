<script>/* sets .dark before the first paint, from the same sources as src/lib/theme.ts: the saved choice, else the host's data-theme, else the system */
(function(){try{var r=document.documentElement,p=null;try{p=localStorage.getItem("homerow.theme")}catch(e){}
var t=p==="light"||p==="dark"?p:r.getAttribute("data-theme"),d=t==="dark"||(t!=="light"&&matchMedia("(prefers-color-scheme: dark)").matches);
r.classList.toggle("dark",d);r.style.colorScheme=d?"dark":"light"}catch(e){}})();</script>
